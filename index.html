
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>✈️ Control Aeropuerto – Neural Apps</title>
<style>
  :root{ --rojo:#e53935; --borde:#e5e7eb; }
  *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Arial}
  body{margin:0;background:#fff;color:#111}
  header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--borde)}
  .bar{display:flex;gap:.5rem;align-items:center;justify-content:space-between;padding:.75rem 1rem;flex-wrap:wrap}
  .title{font-weight:800}
  .btn{padding:.6rem .9rem;border:1px solid var(--borde);border-radius:.8rem;background:#fff;cursor:pointer;font-weight:600}
  .btn.primary{background:var(--rojo);color:#fff;border-color:var(--rojo)}
  .wrap{max-width:1100px;margin:0 auto;padding:1rem}
  .controls{display:flex;gap:.5rem;flex-wrap:wrap;margin:.75rem 0}
  input[type="text"], input[type="date"], input[type="time"]{padding:.6rem;border:1px solid var(--borde);border-radius:.7rem;min-width:10rem}
  table{width:100%;border-collapse:collapse;margin-top:.5rem}
  th,td{border:1px solid var(--borde);padding:.5rem;text-align:left}
  th{background:#f8fafc;position:sticky;top:64px;z-index:1}
  tr:hover td{background:#fff7f7}
  .bottom-add{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--borde);padding:.6rem;display:flex;gap:.5rem;flex-wrap:wrap}
  .center{text-align:center}
  .muted{opacity:.7}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="title">✈️ Control Aeropuerto</div>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap">
      <button id="btnExport" class="btn">Exportar CSV</button>
      <label class="btn">
        Importar CSV
        <input id="fileCsv" type="file" accept=".csv" style="display:none">
      </label>
      <button id="btnReset" class="btn">Borrar todo</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="controls">
    <input id="buscar" type="text" placeholder="Buscar por nombre o vuelo">
  </div>

  <table id="tabla">
    <thead>
      <tr id="theadRow"></tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<div class="bottom-add">
  <input id="nuevoNombre" type="text" placeholder="Nombre">
  <input id="nuevaFecha" type="date" placeholder="Fecha">
  <input id="nuevoVuelo" type="text" placeholder="Vuelo (ej. AM 714)">
  <input id="nuevaSale" type="time" placeholder="Sale">
  <input id="nuevaLlega" type="time" placeholder="Llega">
  <button id="btnAgregar" class="btn primary">Agregar pasajero</button>
  <span class="muted">Se guarda en tu navegador</span>
</div>

<script>
const key = "control_aeropuerto_v1";

const headers = ["#","NOMBRE","FECHA","VUELO","SALE","LLEGA","Estatus","Notas",""];
function loadState(){
  const saved = localStorage.getItem(key);
  if(saved) return JSON.parse(saved);
  return {rows: [{"NOMBRE": "DANIEL SANCHEZ", "FECHA": "26/10/2025", "VUELO": "AM 714", "SALE": "21:25", "LLEGA": "23:25", "Estatus": "", "Notas": ""}, {"NOMBRE": "JAVIER SANCHEZ", "FECHA": "26/10/2025", "VUELO": "AM 714", "SALE": "21:25", "LLEGA": "23:25", "Estatus": "", "Notas": ""}, {"NOMBRE": "Bernardette Olvera", "FECHA": "26/10/2025", "VUELO": "AM 224", "SALE": "12:00", "LLEGA": "13:28", "Estatus": "", "Notas": ""}, {"NOMBRE": "José Pablo Rodriguez", "FECHA": "26/10/2025", "VUELO": "AM 260", "SALE": "21:00", "LLEGA": "22:30", "Estatus": "", "Notas": ""}, {"NOMBRE": "José Noel Alvarez", "FECHA": "26/10/2025", "VUELO": "AM 260", "SALE": "21:00", "LLEGA": "22:30", "Estatus": "", "Notas": ""}, {"NOMBRE": "ISRAEL RODRIGUEZ", "FECHA": "26/10/2025", "VUELO": "AM 954", "SALE": "19:30", "LLEGA": "21:18", "Estatus": "", "Notas": ""}, {"NOMBRE": "ELIA ELEONOR ABREU", "FECHA": "26/10/2025", "VUELO": "AM 954", "SALE": "19:30", "LLEGA": "21:18", "Estatus": "", "Notas": ""}, {"NOMBRE": "LUIS ALBERTO AGUILAR", "FECHA": "26/10/2025", "VUELO": "AM 954", "SALE": "19:30", "LLEGA": "21:18", "Estatus": "", "Notas": ""}, {"NOMBRE": "JULIO CESAR VELIZ", "FECHA": "26/10/2025", "VUELO": "AM 954", "SALE": "19:30", "LLEGA": "21:18", "Estatus": "", "Notas": ""}, {"NOMBRE": "CHRISTIAN RODRIGUEZ", "FECHA": "26/10/2025", "VUELO": "AM 962", "SALE": "18:25", "LLEGA": "20:13", "Estatus": "", "Notas": ""}, {"NOMBRE": "ERIKA PAOLA HERNANDEZ ANCHONDO", "FECHA": "26/10/2025", "VUELO": "AM 962", "SALE": "21:20", "LLEGA": "23:08", "Estatus": "", "Notas": ""}]};
}
let state = loadState();
function save(){ localStorage.setItem(key, JSON.stringify(state)); }

function render(){
  // header
  const th = document.getElementById("theadRow"); th.innerHTML="";
  headers.forEach(h=>{ const el=document.createElement("th"); el.textContent=h; th.appendChild(el); });

  const q = document.getElementById("buscar").value.toLowerCase();
  const tbody = document.getElementById("tbody"); tbody.innerHTML="";
  state.rows.forEach((row,i)=>{
    if(q && !(row.NOMBRE.toLowerCase().includes(q) || (row.VUELO||'').toLowerCase().includes(q))) return;
    const tr = document.createElement("tr");
    // #
    let td = document.createElement("td"); td.textContent = i+1; tr.appendChild(td);
    // NOMBRE
    td = document.createElement("td"); const inNom = document.createElement("input"); inNom.type="text"; inNom.value=row.NOMBRE||"";
    inNom.onchange = e=>{ row.NOMBRE=e.target.value; save(); }; td.appendChild(inNom); tr.appendChild(td);
    // FECHA
    td = document.createElement("td"); const inFecha = document.createElement("input"); inFecha.type="date"; inFecha.value=row.FECHA?row.FECHA.split('/').reverse().join('-'):"";
    inFecha.onchange = e=>{ const v=e.target.value; if(v){ const [y,m,d]=v.split('-'); row.FECHA=`${d}/${m}/${y}`; } else { row.FECHA=""; } save(); };
    td.appendChild(inFecha); tr.appendChild(td);
    // VUELO
    td = document.createElement("td"); const inVuelo = document.createElement("input"); inVuelo.type="text"; inVuelo.value=row.VUELO||"";
    inVuelo.onchange = e=>{ row.VUELO=e.target.value; save(); }; td.appendChild(inVuelo); tr.appendChild(td);
    // SALE
    td = document.createElement("td"); const inSale = document.createElement("input"); inSale.type="time"; inSale.value=(row.SALE||"");
    inSale.onchange = e=>{ row.SALE=e.target.value; save(); }; td.appendChild(inSale); tr.appendChild(td);
    // LLEGA
    td = document.createElement("td"); const inLlega = document.createElement("input"); inLlega.type="time"; inLlega.value=(row.LLEGA||"");
    inLlega.onchange = e=>{ row.LLEGA=e.target.value; save(); }; td.appendChild(inLlega); tr.appendChild(td);
    // Estatus
    td = document.createElement("td"); td.className="center";
    const chk = document.createElement("input"); chk.type="checkbox"; chk.checked=!!row.Estatus;
    chk.onchange = e=>{ row.Estatus = e.target.checked ? 1 : ""; save(); }; td.appendChild(chk); tr.appendChild(td);
    // Notas
    td = document.createElement("td"); const inNotas = document.createElement("input"); inNotas.type="text"; inNotas.value=row.Notas||"";
    inNotas.onchange = e=>{ row.Notas=e.target.value; save(); }; td.appendChild(inNotas); tr.appendChild(td);
    // Acciones
    td = document.createElement("td"); const del=document.createElement("button"); del.className="btn"; del.textContent="Eliminar";
    del.onclick=()=>{ state.rows.splice(i,1); save(); render(); }; td.appendChild(del); tr.appendChild(td);

    tbody.appendChild(tr);
  });
}

document.getElementById("btnAgregar").onclick = ()=>{
  const n = document.getElementById("nuevoNombre").value.trim();
  const f = document.getElementById("nuevaFecha").value;
  const v = document.getElementById("nuevoVuelo").value.trim();
  const s = document.getElementById("nuevaSale").value;
  const l = document.getElementById("nuevaLlega").value;
  if(!n) return;
  const fecha = f ? (()=>{const [y,m,d]=f.split('-'); return `${d}/${m}/${y}`;})() : "";
  state.rows.push({NOMBRE:n, FECHA:fecha, VUELO:v, SALE:s, LLEGA:l, Estatus:"", Notas:""});
  ["nuevoNombre","nuevaFecha","nuevoVuelo","nuevaSale","nuevaLlega"].forEach(id=> document.getElementById(id).value="");
  save(); render();
};

document.getElementById("buscar").oninput = render;

document.getElementById("btnReset").onclick = ()=>{
  if(confirm("¿Borrar todo y restaurar lista inicial?")){
    localStorage.removeItem(key);
    state = {rows: [{"NOMBRE": "DANIEL SANCHEZ", "FECHA": "26/10/2025", "VUELO": "AM 714", "SALE": "21:25", "LLEGA": "23:25", "Estatus": "", "Notas": ""}, {"NOMBRE": "JAVIER SANCHEZ", "FECHA": "26/10/2025", "VUELO": "AM 714", "SALE": "21:25", "LLEGA": "23:25", "Estatus": "", "Notas": ""}, {"NOMBRE": "Bernardette Olvera", "FECHA": "26/10/2025", "VUELO": "AM 224", "SALE": "12:00", "LLEGA": "13:28", "Estatus": "", "Notas": ""}, {"NOMBRE": "José Pablo Rodriguez", "FECHA": "26/10/2025", "VUELO": "AM 260", "SALE": "21:00", "LLEGA": "22:30", "Estatus": "", "Notas": ""}, {"NOMBRE": "José Noel Alvarez", "FECHA": "26/10/2025", "VUELO": "AM 260", "SALE": "21:00", "LLEGA": "22:30", "Estatus": "", "Notas": ""}, {"NOMBRE": "ISRAEL RODRIGUEZ", "FECHA": "26/10/2025", "VUELO": "AM 954", "SALE": "19:30", "LLEGA": "21:18", "Estatus": "", "Notas": ""}, {"NOMBRE": "ELIA ELEONOR ABREU", "FECHA": "26/10/2025", "VUELO": "AM 954", "SALE": "19:30", "LLEGA": "21:18", "Estatus": "", "Notas": ""}, {"NOMBRE": "LUIS ALBERTO AGUILAR", "FECHA": "26/10/2025", "VUELO": "AM 954", "SALE": "19:30", "LLEGA": "21:18", "Estatus": "", "Notas": ""}, {"NOMBRE": "JULIO CESAR VELIZ", "FECHA": "26/10/2025", "VUELO": "AM 954", "SALE": "19:30", "LLEGA": "21:18", "Estatus": "", "Notas": ""}, {"NOMBRE": "CHRISTIAN RODRIGUEZ", "FECHA": "26/10/2025", "VUELO": "AM 962", "SALE": "18:25", "LLEGA": "20:13", "Estatus": "", "Notas": ""}, {"NOMBRE": "ERIKA PAOLA HERNANDEZ ANCHONDO", "FECHA": "26/10/2025", "VUELO": "AM 962", "SALE": "21:20", "LLEGA": "23:08", "Estatus": "", "Notas": ""}]};
    save(); render();
  }
};

function toCSV(){
  const headers = ["NOMBRE","FECHA","VUELO","SALE","LLEGA","Estatus","Notas"];
  const lines = [headers.join(",")];
  state.rows.forEach(r=>{
    const vals = [r.NOMBRE||"", r.FECHA||"", r.VUELO||"", r.SALE||"", r.LLEGA||"", r.Estatus?1:"", r.Notas||""];
    const esc = vals.map(v => `"${String(v).replaceAll('"','""')}"`);
    lines.push(esc.join(","));
  });
  return lines.join("\n");
}

document.getElementById("btnExport").onclick = ()=>{
  const blob = new Blob([toCSV()],{type:"text/csv;charset=utf-8;"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "control_aeropuerto.csv";
  a.click();
};

document.getElementById("fileCsv").onchange = (e)=>{
  const f = e.target.files[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    const text = reader.result;
    const lines = text.split(/\r?\n/).filter(x=>x.trim().length);
    const headers = lines[0].split(",").map(h=>h.replaceAll('"','').trim());
    state.rows = lines.slice(1).map(line=>{
      const cols = line.match(/("([^"]|"")*"|[^,]*)/g).filter((_,i)=> i<headers.length).map(c=>c.replace(/^"|"$/g,"").replaceAll('""','"'));
      const obj = {};
      headers.forEach((h,idx)=>{ obj[h] = cols[idx] || ""; });
      return obj;
    });
    save(); render();
  };
  reader.readAsText(f,"utf-8");
};

render();
</script>
</body>
</html>
